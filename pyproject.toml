[project]
name = "pydanticai-poc"
version = "0.1.0"
description = "Local read-only research agent with a FastAPI web interface"
readme = "README.md"
authors = [
    { name = "Nils Reuße", email = "n.reusse@hxgn.net" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "pydantic-ai-slim[ag-ui,openai]",
    "pydantic-settings",
    "uvicorn",
]

[project.scripts]
pydanticai-poc = "pydanticai_poc:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.11"

[dependency-groups]
dev = [
    "library-skills>=0.0.19",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13.2",
]

# Keep this POC independent of the Python 3.13 workspace in the parent directory.
[tool.uv.workspace]
members = []
